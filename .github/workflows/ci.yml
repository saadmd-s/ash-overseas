name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # SRS §20's gating rule: all six §6 acceptance scenarios must pass at
      # BOTH the pure and the D1-integration level. Phase 0 ran the scenarios
      # with continue-on-error because the engine was deliberately unimplemented;
      # that flag came off the moment Phase 1 landed, and must never go back.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit
        run: pnpm audit --audit-level high
